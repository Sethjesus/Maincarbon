<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>電費與碳排放計算器</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { display: flex; justify-content: space-between; align-items: flex-start; }
        .inputs, .results { width: 48%; padding: 20px; border-radius: 8px; }
        .results { background: #f9f9f9; }
        .input-container { margin-bottom: 15px; }
        input[type="text"] { width: 120px; text-align: right; }
        button {
            padding: 10px 20px; font-size: 16px; background-color: #4CAF50;
            color: white; border: none; cursor: pointer; border-radius: 5px;
        }
        button:hover { background-color: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, th, td { border: 1px solid black; text-align: center; padding: 8px; }
    </style>
</head>
<body>
    <h2>電費與碳排放計算器</h2>
    <div class="container">
        <div class="inputs">
            <p>請輸入每兩個月的帳單金額 (NTD)：</p>
            <div id="input-fields"></div>
            <button onclick="calculateElectricity()">計算</button>
        </div>

        <div class="results">
            <h3>📊 每兩個月電費計算細節：</h3>
            <table id="carbon-table">
                <tr>
                    <th>月份</th><th>總用電量 (kWh)</th><th>適用級距</th><th>適用費率</th>
                    <th>電費</th><th>基本費</th><th>燃料費</th><th>總碳排量 (噸)</th><th>總計</th>
                </tr>
            </table>
            <h3>🟢 **總電力消耗**: <span id="total_electricity">0</span> kWh</h3>
            <h3>🔴 **總碳排量**: <span id="carbon_emission">0</span> 噸</h3>
            <h3>⚠️ **總電費**: <span id="carbon_fee">0</span> NTD</h3>
            <h3>🔥 **總燃料費**: <span id="fuel_fee">0</span> NTD</h3>
            <h3>💰 **總基本費**: <span id="base_fee">0</span> NTD</h3>
        </div>
    </div>

    <script>
        const month_pairs = [
            { id: "1_2", label: "1~2月", season: "normal" },
            { id: "3_4", label: "3~4月", season: "normal" },
            { id: "5_6", label: "5~6月 (夏季)", season: "summer" },
            { id: "7_8", label: "7~8月 (夏季)", season: "summer" },
            { id: "9_10", label: "9~10月", season: "normal" },
            { id: "11_12", label: "11~12月", season: "normal" }
        ];

        function initInputs() {
            const inputFields = document.getElementById("input-fields");
            month_pairs.forEach(pair => {
                inputFields.innerHTML += `<div class="input-container">
                    <label>${pair.label}: <input type="text" id="bill_${pair.id}" value="0"></label>
                </div>`;
            });
        }

        function estimateElectricity(bill_amount, season) {
            const rate = season === "summer" ? 8.46 : 6.63;  // 夏季 8.46，非夏季 6.63
            const base_fee = 15;
            const fuel_rate = 0.08;
            const carbon_factor = 0.495;  // 碳排放係數 kg/kWh

            let estimated_energy = (bill_amount - base_fee) / (rate + fuel_rate);
            estimated_energy = Math.round(estimated_energy); // 四捨五入確保整數

            let fee = estimated_energy * rate;
            let fuel = estimated_energy * fuel_rate;
            let total_cost = fee + base_fee + fuel;

            let adjustment = bill_amount - total_cost;
            fee += adjustment; // 修正誤差
            total_cost = fee + base_fee + fuel; 

            let carbon_emission = estimated_energy * carbon_factor / 1000; // 轉換為噸

            return {
                energy_used: estimated_energy,
                rate: rate.toFixed(2),
                fee: fee.toFixed(2),
                fuel: fuel.toFixed(2),
                carbon_emission: carbon_emission.toFixed(4),
                total_cost: total_cost.toFixed(2)
            };
        }

        function calculateElectricity() {
            let total_electricity = 0;
            let total_fee = 0;
            let total_fuel = 0;
            let total_base = 0;
            let total_carbon = 0;

            const table = document.getElementById("carbon-table");
            table.innerHTML = `<tr>
                <th>月份</th><th>總用電量 (kWh)</th><th>適用級距</th><th>適用費率</th>
                <th>電費</th><th>基本費</th><th>燃料費</th><th>總碳排量 (噸)</th><th>總計</th>
            </tr>`;

            month_pairs.forEach(pair => {
                let bill_amount = parseFloat(document.getElementById(`bill_${pair.id}`).value) || 0;
                let result = estimateElectricity(bill_amount, pair.season);

                total_electricity += parseFloat(result.energy_used);
                total_fee += parseFloat(result.fee);
                total_fuel += parseFloat(result.fuel);
                total_carbon += parseFloat(result.carbon_emission);
                total_base += 15;

                table.innerHTML += `<tr>
                    <td>${pair.label}</td>
                    <td>${result.energy_used}</td>
                    <td>1000~Infinity kWh</td>
                    <td>${result.rate} 元/kWh</td>
                    <td>${result.fee}</td>
                    <td>15</td>
                    <td>${result.fuel}</td>
                    <td>${result.carbon_emission}</td>
                    <td>${bill_amount}</td>
                </tr>`;
            });

            document.getElementById("total_electricity").innerText = `${total_electricity.toFixed(2)} `;
            document.getElementById("carbon_emission").innerText = `${total_carbon.toFixed(4)} `;
            document.getElementById("carbon_fee").innerText = `${total_fee.toFixed(2)} `;
            document.getElementById("fuel_fee").innerText = `${total_fuel.toFixed(2)} `;
            document.getElementById("base_fee").innerText = `${total_base.toFixed(2)} `;
        }

        window.onload = initInputs;
    </script>
</body>
</html>
